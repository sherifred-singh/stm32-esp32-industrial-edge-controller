name: CI Automated Protocol & Firmware Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native-c-unit-tests:
    name: Native C99 Protocol Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Compile Native C Unit Test Runner
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
              -Icommon/include \
              tests/test_intermcu_protocol.c \
              common/src/intermcu_protocol.c \
              common/src/intermcu_crc16.c \
              -o test_protocol

      - name: Execute Native C Unit Tests
        run: |
          ./test_protocol

  python-protocol-tests:
    name: Automated Protocol Fuzzing & Stress Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python Protocol Test Suite
        run: |
          python tools/protocol_host_tester.py
