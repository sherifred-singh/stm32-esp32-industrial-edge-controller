<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="stmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a153b"/>
      <stop offset="100%" stop-color="#0c0a21"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>

    <!-- Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="500" y="38" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="800" letter-spacing="1">DUAL-MCU INDUSTRIAL IOT EDGE CONTROLLER ARCHITECTURE</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">STM32F446RE Real-Time FreeRTOS Core &amp; ESP32-S3 Wireless Gateway Inter-Processor Pipeline</text>

  <!-- ==================== STM32F446RE CONTAINER ==================== -->
  <rect x="40" y="85" width="430" height="450" rx="12" fill="url(#stmGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- STM32 Header Badge -->
  <rect x="58" y="100" width="220" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="168" y="116" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">STM32F446RE (ARM Cortex-M4 @ 180MHz)</text>
  <text x="450" y="116" text-anchor="end" fill="#64748b" font-size="11">FreeRTOS v10.x</text>

  <!-- STM32 Tasks Container -->
  <!-- Task 1: Supervisor -->
  <rect x="58" y="136" width="394" height="68" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="74" y="157" fill="#f87171" font-size="12.5" font-weight="700">FaultSupervisorTask [Priority: 4 (Highest)]</text>
  <text x="74" y="175" fill="#94a3b8" font-size="11">• 16-Entry Circular Overwrite History Table</text>
  <text x="74" y="191" fill="#94a3b8" font-size="11">• Protected by <tspan fill="#38bdf8" font-family="Consolas, monospace">xFaultTableMutex</tspan> (Priority Inheritance)</text>

  <!-- Task 2: Actuator -->
  <rect x="58" y="214" width="394" height="68" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="74" y="235" fill="#fbbf24" font-size="12.5" font-weight="700">ActuatorControlTask [Priority: 3]</text>
  <text x="74" y="253" fill="#94a3b8" font-size="11">• TIM1 20kHz PWM Motor Duty Cycle Modulation</text>
  <text x="74" y="269" fill="#94a3b8" font-size="11">• Dual Relay Solenoid Control &amp; Sub-millisecond E-Stop</text>

  <!-- Task 3: Sensor Acq -->
  <rect x="58" y="292" width="394" height="74" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="74" y="313" fill="#34d399" font-size="12.5" font-weight="700">SensorAcqTask [Priority: 2] (10 Hz Deterministic)</text>
  <text x="74" y="331" fill="#94a3b8" font-size="11">• ADC1 + DMA2 Stream 0 (Circular Mode, 16x Oversampling)</text>
  <text x="74" y="347" fill="#94a3b8" font-size="11">• Temp (-20..105°C), Vibration RMS (mg), DC Voltage (0..36V)</text>

  <!-- Task 4: Inter-MCU Comm -->
  <rect x="58" y="376" width="394" height="74" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="74" y="397" fill="#38bdf8" font-size="12.5" font-weight="700">InterMcuCommTask [Priority: 1]</text>
  <text x="74" y="415" fill="#94a3b8" font-size="11">• USART2 DMA RX with IDLE-Line Interrupt Detection</text>
  <text x="74" y="431" fill="#94a3b8" font-size="11">• Direct Task Notifications &amp; CRC-16 Frame Encoding</text>

  <!-- Low Level Drivers Tag -->
  <rect x="58" y="462" width="394" height="56" rx="6" fill="#0b1329" stroke="#1e293b"/>
  <text x="74" y="482" fill="#cbd5e1" font-size="11.5" font-weight="600">Hardware Peripheral Layer:</text>
  <text x="74" y="502" fill="#64748b" font-size="10.5" font-family="Consolas, monospace">USART2 (PA2/PA3) | ADC1 (PA0/PA1/PA4) | TIM1 (PA8) | Relays (PB0/PB1)</text>

  <!-- ==================== ESP32-S3 CONTAINER ==================== -->
  <rect x="530" y="85" width="430" height="450" rx="12" fill="url(#espGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- ESP32 Header Badge -->
  <rect x="548" y="100" width="220" height="24" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
  <text x="658" y="116" text-anchor="middle" fill="#818cf8" font-size="11.5" font-weight="700">ESP32-S3 (Dual-Core LX7 @ 240MHz)</text>
  <text x="940" y="116" text-anchor="end" fill="#64748b" font-size="11">ESP-IDF FreeRTOS SMP</text>

  <!-- Core 0 Block: Networking -->
  <rect x="548" y="136" width="394" height="126" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="548" y="136" width="394" height="26" rx="8" fill="#1e293b"/>
  <text x="564" y="153" fill="#60a5fa" font-size="12" font-weight="700">Core 0: TCP/IP &amp; Cloud Gateway Engine</text>
  <text x="564" y="182" fill="#f8fafc" font-size="11.5" font-weight="600">• Wi-Fi 802.11 b/g/n Station (Auto-reconnect with backoff)</text>
  <text x="564" y="202" fill="#94a3b8" font-size="11">• MQTT Client (QoS 1, JSON Telemetry Stream to HiveMQ)</text>
  <text x="564" y="222" fill="#94a3b8" font-size="11">• Remote Cloud Command Listener (<tspan fill="#38bdf8" font-family="Consolas, monospace">industrial/edge_hub/commands</tspan>)</text>
  <text x="564" y="242" fill="#64748b" font-size="10.5" font-family="Consolas, monospace">Payload: {"dev":"edge_hub_s3","temp":42.5,"vib":1200,...}</text>

  <!-- Core 1 Block: BLE & Protocol -->
  <rect x="548" y="272" width="394" height="178" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="548" y="272" width="394" height="26" rx="8" fill="#1e293b"/>
  <text x="564" y="289" fill="#a78bfa" font-size="12" font-weight="700">Core 1: Field Wireless &amp; Inter-MCU IPC Engine</text>
  
  <text x="564" y="318" fill="#f8fafc" font-size="11.5" font-weight="600">• BLE 5.0 GATT Server ("EDGE-HUB-S3")</text>
  <text x="578" y="336" fill="#94a3b8" font-size="11">- Service UUID: <tspan fill="#a78bfa" font-family="Consolas, monospace">0xFFF0</tspan> (Industrial Edge Service)</text>
  <text x="578" y="354" fill="#94a3b8" font-size="11">- Telemetry Char: <tspan fill="#34d399" font-family="Consolas, monospace">0xFFF1</tspan> (Property: NOTIFY @ 10 Hz)</text>
  <text x="578" y="372" fill="#94a3b8" font-size="11">- Control Char: <tspan fill="#fbbf24" font-family="Consolas, monospace">0xFFF2</tspan> (Property: WRITE with response)</text>
  
  <text x="564" y="400" fill="#f8fafc" font-size="11.5" font-weight="600">• InterMcuBridgeTask</text>
  <text x="578" y="418" fill="#94a3b8" font-size="11">- UART1 DMA Receiver &amp; Streaming State Machine</text>
  <text x="578" y="434" fill="#94a3b8" font-size="11">- Checksum Validation &amp; Dual-Radio Forwarding</text>

  <!-- ESP32 Hardware Tag -->
  <rect x="548" y="462" width="394" height="56" rx="6" fill="#0c0c26" stroke="#1e293b"/>
  <text x="564" y="482" fill="#cbd5e1" font-size="11.5" font-weight="600">Hardware Peripherals &amp; Radio:</text>
  <text x="564" y="502" fill="#64748b" font-size="10.5" font-family="Consolas, monospace">UART1 (GPIO17 TX / GPIO18 RX) | 2.4GHz Wi-Fi | Bluetooth 5 (LE)</text>

  <!-- ==================== INTER-MCU PROTOCOL BUS ==================== -->
  <rect x="40" y="555" width="920" height="100" rx="10" fill="url(#busGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  
  <text x="60" y="580" fill="#38bdf8" font-size="12" font-weight="700">ROBUST INTER-PROCESSOR SERIAL LINK (115,200 / 921,600 BAUD)</text>
  <text x="940" y="580" text-anchor="end" fill="#94a3b8" font-size="11">Full-Duplex UART DMA • 3.3V TTL • CRC-16-CCITT</text>

  <!-- Signals lines -->
  <line x1="250" y1="520" x2="250" y2="555" stroke="#38bdf8" stroke-width="2"/>
  <line x1="750" y1="520" x2="750" y2="555" stroke="#38bdf8" stroke-width="2"/>

  <!-- Protocol Frame Diagram -->
  <g transform="translate(60, 595)">
    <!-- Sync -->
    <rect x="0" y="0" width="100" height="38" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="50" y="17" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">SYNC WORD</text>
    <text x="50" y="31" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Consolas, monospace">0xAA 0x55</text>

    <!-- Len -->
    <rect x="105" y="0" width="70" height="38" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="140" y="17" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">LEN</text>
    <text x="140" y="31" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Consolas, monospace">1 Byte</text>

    <!-- Type -->
    <rect x="180" y="0" width="80" height="38" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="220" y="17" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">MSG TYPE</text>
    <text x="220" y="31" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Consolas, monospace">0x01..0x06</text>

    <!-- Seq -->
    <rect x="265" y="0" width="70" height="38" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="300" y="17" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">SEQ NUM</text>
    <text x="300" y="31" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Consolas, monospace">0..255</text>

    <!-- Payload -->
    <rect x="340" y="0" width="370" height="38" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="525" y="17" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">STRUCTURED DATA PAYLOAD (0 to 64 Bytes)</text>
    <text x="525" y="31" text-anchor="middle" fill="#94a3b8" font-size="9">Telemetry (Temp, Vib, Volt, Curr, RPM) | Actuator Commands | Fault Snapshots</text>

    <!-- CRC -->
    <rect x="715" y="0" width="165" height="38" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="797" y="17" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">CRC-16-CCITT (2 Bytes)</text>
    <text x="797" y="31" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Consolas, monospace">Poly 0x1021 (MSB, LSB)</text>
  </g>

</svg>
